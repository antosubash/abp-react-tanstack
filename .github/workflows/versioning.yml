name: Automatic Versioning

on:
  push:
    branches: [ dev ]

jobs:
  versioning:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Get latest tag
        id: get-latest-tag
        run: |
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          # Remove 'v' prefix if present
          VERSION=${LATEST_TAG#v}
          echo "latest_version=$VERSION" >> $GITHUB_OUTPUT
          echo "Latest tag: $LATEST_TAG, Version: $VERSION"

      - name: Increment patch version
        id: increment-version
        run: |
          VERSION="${{ steps.get-latest-tag.outputs.latest_version }}"
          # Split version into major.minor.patch
          IFS='.' read -ra VERSION_PARTS <<< "$VERSION"
          MAJOR=${VERSION_PARTS[0]}
          MINOR=${VERSION_PARTS[1]}
          PATCH=${VERSION_PARTS[2]}

          # Increment patch version
          NEW_PATCH=$((PATCH + 1))
          NEW_VERSION="$MAJOR.$MINOR.$NEW_PATCH"

          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "New version: $NEW_VERSION"

      - name: Update package.json version
        run: |
          # Update version in package.json
          jq ".version = \"${{ steps.increment-version.outputs.new_version }}\"" package.json > package.json.tmp
          mv package.json.tmp package.json

      - name: Commit version update
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add package.json
          git commit -m "chore: bump version to ${{ steps.increment-version.outputs.new_version }}" || echo "No changes to commit"

      - name: Create tag
        run: |
          git tag "v${{ steps.increment-version.outputs.new_version }}"
          git push origin "v${{ steps.increment-version.outputs.new_version }}"

      - name: Create GitHub release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ steps.increment-version.outputs.new_version }}
          release_name: Release v${{ steps.increment-version.outputs.new_version }}
          body: |
            Automatic patch version bump to ${{ steps.increment-version.outputs.new_version }}

            This release was automatically created from the dev branch.
          draft: false
          prerelease: false
