name: Automatic Versioning

on:
  push:
    branches: [ dev ]

jobs:
  versioning:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch all tags
        run: |
          git fetch --tags --force

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Get current version from package.json
        id: get-package-version
        run: |
          # Get version from package.json
          PACKAGE_VERSION=$(jq -r '.version' package.json)
          echo "package_version=$PACKAGE_VERSION" >> $GITHUB_ENV
          echo "Package version: $PACKAGE_VERSION"

      - name: Get latest git tag
        id: get-latest-tag
        run: |
          # List all tags and get the latest one
          git tag -l "v*" --sort=-version:refname > /tmp/tags.txt
          
          if [ -s /tmp/tags.txt ]; then
            LATEST_TAG=$(head -n 1 /tmp/tags.txt)
            # Remove 'v' prefix if present
            TAG_VERSION=${LATEST_TAG#v}
            echo "latest_tag=$LATEST_TAG" >> $GITHUB_ENV
            echo "tag_version=$TAG_VERSION" >> $GITHUB_ENV
            echo "Latest tag: $LATEST_TAG, Version: $TAG_VERSION"
          else
            echo "No tags found"
            echo "latest_tag=v0.0.0" >> $GITHUB_ENV
            echo "tag_version=0.0.0" >> $GITHUB_ENV
          fi

      - name: Determine next version
        id: determine-version
        run: |
          PACKAGE_VERSION="${{ env.package_version }}"
          TAG_VERSION="${{ env.tag_version }}"
          
          # Compare package version with tag version
          if [ "$PACKAGE_VERSION" = "$TAG_VERSION" ]; then
            # Versions match, increment patch version
            echo "Versions match, incrementing patch version"
            BASE_VERSION="$PACKAGE_VERSION"
          elif [ "$(printf '%s\n' "$PACKAGE_VERSION" "$TAG_VERSION" | sort -V | head -n1)" = "$TAG_VERSION" ]; then
            # Package version is newer than tag version
            echo "Package version is newer than tag version, using package version"
            BASE_VERSION="$PACKAGE_VERSION"
          else
            # Tag version is newer than package version or no tags exist
            echo "Using package version as base"
            BASE_VERSION="$PACKAGE_VERSION"
          fi
          
          # Split version into major.minor.patch
          IFS='.' read -ra VERSION_PARTS <<< "$BASE_VERSION"
          MAJOR=${VERSION_PARTS[0]}
          MINOR=${VERSION_PARTS[1]}
          PATCH=${VERSION_PARTS[2]}

          # Increment patch version
          NEW_PATCH=$((PATCH + 1))
          NEW_VERSION="$MAJOR.$MINOR.$NEW_PATCH"
          
          # Keep incrementing until we find a version that doesn't exist
          while git rev-parse "v$NEW_VERSION" >/dev/null 2>&1; do
            echo "Tag v$NEW_VERSION already exists, incrementing again"
            NEW_PATCH=$((NEW_PATCH + 1))
            NEW_VERSION="$MAJOR.$MINOR.$NEW_PATCH"
          done

          echo "new_version=$NEW_VERSION" >> $GITHUB_ENV
          echo "Base version: $BASE_VERSION, New version: $NEW_VERSION"

      - name: Update package.json version
        run: |
          # Update version in package.json
          jq ".version = \"${{ env.new_version }}\"" package.json > package.json.tmp
          mv package.json.tmp package.json

      - name: Commit version update
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add package.json
          git commit -m "chore: bump version to ${{ env.new_version }}" || echo "No changes to commit"

      - name: Create and push tag
        run: |
          # Create the tag
          git tag "v${{ env.new_version }}"
          # Push the tag to origin
          git push origin "v${{ env.new_version }}"

      - name: Generate release notes
        id: generate-notes
        run: |
          # Get the previous tag (or use a default if none exists)
          PREVIOUS_TAG="${{ env.latest_tag }}"
          if [ "$PREVIOUS_TAG" = "v0.0.0" ] || [ -z "$PREVIOUS_TAG" ]; then
            # If no previous tag, get the first commit
            PREVIOUS_TAG=$(git rev-list --max-parents=0 HEAD)
            NOTES_HEADER="## 🎉 Initial Release\n\nThis is the first release of abp-react-tanstack!"
          else
            NOTES_HEADER="## 🚀 Changes since $PREVIOUS_TAG"
          fi
          
          # Generate commit logs between previous tag and current HEAD with author info
          COMMITS=$(git log --pretty=format:"- %s ([%h](https://github.com/${{ github.repository }}/commit/%H)) by %an" $PREVIOUS_TAG..HEAD)
          
          # Categorize commits by type
          FEATURES=$(echo "$COMMITS" | grep -E "^- feat" || echo "")
          FIXES=$(echo "$COMMITS" | grep -E "^- fix" || echo "")
          CHORE=$(echo "$COMMITS" | grep -E "^- chore" || echo "")
          DOCS=$(echo "$COMMITS" | grep -E "^- docs" || echo "")
          REFACTOR=$(echo "$COMMITS" | grep -E "^- refactor" || echo "")
          OTHER=$(echo "$COMMITS" | grep -vE "^- (feat|fix|chore|docs|refactor)" || echo "")
          
          # Build release notes
          RELEASE_NOTES="$NOTES_HEADER\n\n"
          
          if [ -n "$FEATURES" ]; then
            RELEASE_NOTES="${RELEASE_NOTES}### ✨ Features\n\n$FEATURES\n\n"
          fi
          
          if [ -n "$FIXES" ]; then
            RELEASE_NOTES="${RELEASE_NOTES}### 🐛 Bug Fixes\n\n$FIXES\n\n"
          fi
          
          if [ -n "$REFACTOR" ]; then
            RELEASE_NOTES="${RELEASE_NOTES}### 🔧 Refactoring\n\n$REFACTOR\n\n"
          fi
          
          if [ -n "$DOCS" ]; then
            RELEASE_NOTES="${RELEASE_NOTES}### 📚 Documentation\n\n$DOCS\n\n"
          fi
          
          if [ -n "$CHORE" ]; then
            RELEASE_NOTES="${RELEASE_NOTES}### 🧹 Maintenance\n\n$CHORE\n\n"
          fi
          
          if [ -n "$OTHER" ]; then
            RELEASE_NOTES="${RELEASE_NOTES}### 📦 Other Changes\n\n$OTHER\n\n"
          fi
          
          # Add statistics
          COMMIT_COUNT=$(echo "$COMMITS" | wc -l)
          RELEASE_NOTES="${RELEASE_NOTES}---\n\n**Statistics:** $COMMIT_COUNT commits since $PREVIOUS_TAG\n\n"
          
          # Get unique contributors with their GitHub usernames
          CONTRIBUTORS=$(git log --pretty=format:"%an|%ae" $PREVIOUS_TAG..HEAD | sort | uniq | while IFS='|' read -r name email; do
            # Extract username from email (assuming format username@domain.com)
            USERNAME=$(echo "$email" | cut -d'@' -f1)
            echo "- [$name](https://github.com/$USERNAME)"
          done | tr '\n' '|' | sed 's/|$//')
          
          # Convert pipe-separated list to newline-separated list
          CONTRIBUTORS_LIST=$(echo "$CONTRIBUTORS" | tr '|' '\n')
          
          # Add contributors count and list
          CONTRIBUTOR_COUNT=$(echo "$CONTRIBUTORS_LIST" | wc -l)
          RELEASE_NOTES="${RELEASE_NOTES}**Contributors ($CONTRIBUTOR_COUNT):**\n\n$CONTRIBUTORS_LIST"
          
          # Save notes to output
          {
            echo "release_notes<<EOF"
            echo -e "$RELEASE_NOTES"
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Create GitHub release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ env.new_version }}
          release_name: Release v${{ env.new_version }}
          body: ${{ steps.generate-notes.outputs.release_notes }}
          draft: false
          prerelease: false
