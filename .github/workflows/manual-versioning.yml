name: Manual Versioning

on:
  workflow_dispatch:
    inputs:
      version_type:
        description: 'Version bump type'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
      target_branch:
        description: 'Target branch to create version from'
        required: true
        default: 'main'
        type: choice
        options:
          - main
          - dev

jobs:
  manual-versioning:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_branch }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Get latest tag
        id: get-latest-tag
        run: |
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          # Remove 'v' prefix if present
          VERSION=${LATEST_TAG#v}
          echo "latest_version=$VERSION" >> $GITHUB_OUTPUT
          echo "Latest tag: $LATEST_TAG, Version: $VERSION"

      - name: Calculate new version
        id: calculate-version
        run: |
          VERSION="${{ steps.get-latest-tag.outputs.latest_version }}"
          VERSION_TYPE="${{ inputs.version_type }}"

          # Split version into major.minor.patch
          IFS='.' read -ra VERSION_PARTS <<< "$VERSION"
          MAJOR=${VERSION_PARTS[0]}
          MINOR=${VERSION_PARTS[1]}
          PATCH=${VERSION_PARTS[2]}

          case $VERSION_TYPE in
            major)
              NEW_MAJOR=$((MAJOR + 1))
              NEW_VERSION="$NEW_MAJOR.0.0"
              ;;
            minor)
              NEW_MINOR=$((MINOR + 1))
              NEW_VERSION="$MAJOR.$NEW_MINOR.0"
              ;;
            patch)
              NEW_PATCH=$((PATCH + 1))
              NEW_VERSION="$MAJOR.$MINOR.$NEW_PATCH"
              ;;
            *)
              echo "Invalid version type: $VERSION_TYPE"
              exit 1
              ;;
          esac

          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "New version: $NEW_VERSION (type: $VERSION_TYPE)"

      - name: Update package.json version
        run: |
          cd src
          # Update version in package.json
          jq ".version = \"${{ steps.calculate-version.outputs.new_version }}\"" package.json > package.json.tmp
          mv package.json.tmp package.json

      - name: Commit version update
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add src/package.json
          git commit -m "chore: bump version to ${{ steps.calculate-version.outputs.new_version }} [${{ inputs.version_type }}]" || echo "No changes to commit"

      - name: Create tag
        run: |
          git tag "v${{ steps.calculate-version.outputs.new_version }}"
          git push origin "v${{ steps.calculate-version.outputs.new_version }}"

      - name: Create GitHub release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ steps.calculate-version.outputs.new_version }}
          release_name: Release v${{ steps.calculate-version.outputs.new_version }}
          body: |
            Manual ${{ inputs.version_type }} version bump to ${{ steps.calculate-version.outputs.new_version }}

            This release was manually triggered from the ${{ inputs.target_branch }} branch.
          draft: false
          prerelease: false
